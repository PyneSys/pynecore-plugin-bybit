[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "pynecore_bybit" = "src/pynecore_bybit" }
packages.find = { where = ["src"] }

[project]
name = "pynesys-pynecore-bybit"
version = "0.9.2"
description = "Bybit v5 integration for PyneCore"
authors = [{ name = "PYNESYS LLC", email = "hello@pynesys.com" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["pynesys-pynecore>=6.6.0", "httpx", "websockets"]

[project.urls]
"Homepage" = "https://pynecore.org"
"Repository" = "https://github.com/PyneSys/pynecore-plugin-bybit"
"Documentation" = "https://pynecore.org/docs"
"Issues" = "https://github.com/PyneSys/pynecore-plugin-bybit/issues"

# Social
"X" = "https://x.com/pynesys"
"Discord" = "https://discord.com/invite/jegnhtq6gy"

[project.entry-points."pyne.plugin"]
bybit = "pynecore_bybit:Bybit"
